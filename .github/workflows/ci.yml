name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== 代码检查 ====================
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  # ==================== 测试 ====================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude cicada-client
      - run: cargo test --workspace --exclude cicada-client
      - run: cargo clippy --workspace --exclude cicada-client -- -D warnings

  # ==================== Web PWA 构建 ====================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: mobile
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cicada-web-pwa
          path: mobile/dist/

  # ==================== Windows 构建 ====================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri app
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build

      - name: Install Inno Setup
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install innosetup --no-progress

      - name: Build Inno Setup installer
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6
          cd crates\cicada-client\src-tauri\installer
          mkdir build
          xcopy /E /Y ..\target\release\bundle\nsis\* build\
          ISCC cicada.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicada-windows
          path: |
            crates/cicada-client/src-tauri/installer/dist/**/*.exe
            crates/cicada-client/src-tauri/target/release/bundle/nsis/*.exe
            crates/cicada-client/src-tauri/target/release/bundle/msi/*.msi

  # ==================== Linux 构建 ====================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri app
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicada-linux
          path: |
            crates/cicada-client/src-tauri/target/release/bundle/deb/*.deb
            crates/cicada-client/src-tauri/target/release/bundle/appimage/*.AppImage

  # ==================== macOS 构建 ====================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri app
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicada-macos
          path: |
            crates/cicada-client/src-tauri/target/release/bundle/dmg/*.dmg

  # ==================== Mock 服务器 ====================
  build-mock-server:
    name: Build Mock Server
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cicada-mock-server
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cicada-mock-server-${{ matrix.os }}
          path: target/release/cicada-mock-server${{ matrix.os == 'windows-latest' && '.exe' || '' }}

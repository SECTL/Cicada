name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Test (core)
        run: |
          cargo build --workspace --exclude cicada-client
          cargo test --workspace --exclude cicada-client
          cargo clippy --workspace --exclude cicada-client -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked
      - name: Build Tauri
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cicada-windows
          path: crates/cicada-client/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Test (core)
        run: |
          cargo build --workspace --exclude cicada-client
          cargo test --workspace --exclude cicada-client
          cargo clippy --workspace --exclude cicada-client -- -D warnings

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsoup2.4-dev libjavascriptcoregtk-4.1-dev || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build || cargo build --release -p cicada-mock-server

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-linux
          path: |
            crates/cicada-client/src-tauri/target/release/bundle/deb/*.deb
            crates/cicada-client/src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/cicada-mock-server

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Test (core)
        run: |
          cargo build --workspace --exclude cicada-client
          cargo test --workspace --exclude cicada-client
          cargo clippy --workspace --exclude cicada-client -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked
      - name: Build Tauri
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cicada-macos
          path: |
            crates/cicada-client/src-tauri/target/release/bundle/dmg/*.dmg
            crates/cicada-client/src-tauri/target/release/bundle/macos/*.dmg

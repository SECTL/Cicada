name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Test (core)
        run: |
          cargo build --workspace --exclude cicada-client
          cargo test --workspace --exclude cicada-client
          cargo clippy --workspace --exclude cicada-client -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup installer
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6
          cd crates\cicada-client\src-tauri\installer
          mkdir build 2>nul
          xcopy /E /Y ..\target\release\bundle\nsis\* build\
          ISCC cicada.iss

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-windows
          path: |
            crates/cicada-client/src-tauri/installer/Output/*.exe
            crates/cicada-client/src-tauri/target/release/bundle/msi/*.msi

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Test (core)
        run: |
          cargo build --workspace --exclude cicada-client
          cargo test --workspace --exclude cicada-client
          cargo clippy --workspace --exclude cicada-client -- -D warnings

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsoup2.4-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-linux
          path: |
            crates/cicada-client/src-tauri/target/release/bundle/deb/*.deb
            crates/cicada-client/src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Test (core)
        run: |
          cargo build --workspace --exclude cicada-client
          cargo test --workspace --exclude cicada-client
          cargo clippy --workspace --exclude cicada-client -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: crates/cicada-client/ui
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "1.6.6" --locked

      - name: Build Tauri
        working-directory: crates/cicada-client
        env:
          GIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-macos
          path: |
            crates/cicada-client/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build mobile PWA
        working-directory: mobile
        run: npm install && npm run build

      - name: Setup Capacitor
        working-directory: mobile
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "知了" "com.cicada.app" --web-dir=dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Build Android APK
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-android
          path: mobile/android/app/build/outputs/apk/debug/*.apk

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (exclude tauri client)
        run: cargo build --workspace --exclude cicada-client

      - name: Test
        run: cargo test --workspace --exclude cicada-client

      - name: Clippy
        run: cargo clippy --workspace --exclude cicada-client -- -D warnings

  tauri-check:
    name: Tauri Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            check-command: cargo check --workspace --exclude cicada-client
          - os: windows-latest
            check-command: cd crates/cicada-client && cargo check
          - os: macos-latest
            check-command: cd crates/cicada-client && cargo check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf || true

      - uses: actions/setup-node@v4
        if: runner.os != 'Linux'
        with:
          node-version: 20

      - name: Install frontend deps
        if: runner.os != 'Linux'
        working-directory: crates/cicada-client/ui
        run: npm ci

      - name: Build frontend
        if: runner.os != 'Linux'
        working-directory: crates/cicada-client/ui
        run: npm run build

      - name: Tauri build check
        run: ${{ matrix.check-command }}
